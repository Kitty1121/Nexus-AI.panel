<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Powerful AI System</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f2f5;
    margin: 0;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  #input-section {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  textarea {
    width: 80%;
    height: 150px;
    padding: 10px;
    font-size: 1em;
  }
  button {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 1em;
  }
  #response {
    margin-top: 20px;
    padding: 10px;
    background-color: #fff;
    border-radius: 8px;
    min-height: 100px;
  }
</style>
</head>
<body>
<header>
  <h1>Powerful AI System</h1>
</header>
<div id="input-section">
  <textarea id="userInput" placeholder="Enter your query or command"></textarea>
  <button onclick="sendRequest()">Send</button>
</div>
<div id="response"></div>

<script>
  async function sendRequest() {
    const input = document.getElementById('userInput').value;
    const responseDiv = document.getElementById('response');

    responseDiv.innerHTML = 'Loading...';

    // Example API call - replace with your backend URL
    const res = await fetch('https://your-backend-api.com/api', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ query: input })
    });
    const data = await res.json();

    responseDiv.innerHTML = data.response;
  }
</script>
</body>
</html>
